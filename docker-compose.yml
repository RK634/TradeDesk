name: import-export-management

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Importer & Exporter Management System}
      APP_VERSION: ${APP_VERSION:-1.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-72}
      PRIVATE_STORAGE_DIR: ${PRIVATE_STORAGE_DIR:-/app/.private_storage}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      AUTOMATION_POLL_SECONDS: ${AUTOMATION_POLL_SECONDS:-60}
    volumes:
      - private_documents:/app/.private_storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-1.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      PRIVATE_STORAGE_DIR: ${PRIVATE_STORAGE_DIR:-/app/.private_storage}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      AUTOMATION_POLL_SECONDS: ${AUTOMATION_POLL_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  private_documents:
