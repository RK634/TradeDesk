name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iem_test
          POSTGRES_PASSWORD: iem_test_password
          POSTGRES_DB: iem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iem_test -d iem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://iem_test:iem_test_password@127.0.0.1:5432/iem_test
      SESSION_COOKIE_SECURE: "false"
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Compile backend
        run: python -m compileall -q app
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head
        working-directory: backend
      - name: Check migration metadata drift
        run: alembic check
        working-directory: backend

  frontend:
    name: Frontend typecheck, tests, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Run frontend tests
        run: npm run test -- --run
        working-directory: frontend
      - name: Build production frontend
        run: npm run build
        working-directory: frontend

  compose:
    name: Compose and container build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load local validation configuration
        run: cp .env.example .env
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build
      - name: Clean local environment file
        if: always()
        run: rm -f .env

  e2e:
    name: Browser smoke workflow
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install pytest playwright==1.57.0
          playwright install --with-deps chromium
      - name: Start the application
        run: |
          cp .env.example .env
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null && curl --fail --silent http://127.0.0.1:8000/api/v1/health/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/api/v1/health/ready
          docker compose exec -T backend alembic upgrade head
      - name: Run browser workflow smoke test
        env:
          BASE_URL: http://127.0.0.1:8080
        run: python -m pytest -q qa/e2e
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop containers and remove test volumes
        if: always()
        run: docker compose down -v
